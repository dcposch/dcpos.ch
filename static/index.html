<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Posch</title>
<style>
* { box-sizing: border-box; }

/* Design tokens (powers of two) */
:root {
  --space-4: 4px;
  --space-8: 8px;
  --space-16: 16px;
  --space-32: 32px;
  --space-64: 64px;
  --max-w: 512px;
}

html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color: #111;
  background: #fafafa;
}

a, a:visited { color: #111; text-decoration: underline; text-underline-offset: 2px; }
a:hover { text-decoration: none; }

main {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: var(--space-32);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-32) var(--space-32);
}

h1 { font-size: 28px; font-weight: 600; margin: 0 0 var(--space-16) 0; letter-spacing: 0.2px; }

.photo { width: 128px; border-radius: 6px; display: block; }
.portrait { justify-self: end; align-self: start; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #666; margin-bottom: var(--space-8); }
p { margin: 0; line-height: 1.6; }
ul { list-style: none; padding: 0; margin: 0; }
li { margin-bottom: var(--space-8); }

/* KV grid */
.kv { display: grid; grid-template-columns: 80px 1fr; column-gap: var(--space-16); align-items: baseline; }
.key { color: #666; }
.kv > :last-child { user-select: all; }

blockquote { margin: 0; color: #777; grid-column: 1 / -1; }

@media (max-width: 480px) {
  main {
    grid-template-columns: 1fr;
    gap: var(--space-32);
  }
  .portrait { justify-self: start; order: -1; }
}

</style>
</head>
<body>
<main>
  <section>
    <h1>Dan Clemens Posch</h1>
    <ul>
      <li class="kv"><span class="key">@dcposch</span><span><a href="https://x.com/dcposch">x</a> · <a href="https://github.com/dcposch">github</a></span></li>
      <li class="kv"><span class="key">email</span><span>dcposch@cs.stanford.edu</span></li>
      <li class="kv"><span class="key">eth</span><span>dcposch.eth</span></li>
    </ul>
  </section>

  <section class="portrait">
    <img class="photo" src="img/dcposch.jpg" alt="Portrait of DC Posch">
  </section>

  <section>
    <div class="label">Projects</div>
    <ul>
      <li><a href="https://daimo.com">Daimo</a></li>
      <li><a href="https://sf10x.org">SF10x</a></li>
    </ul>
  </section>

  <blockquote>
    <p>Interested in technology. Friend to all dogs.</p>
  </blockquote>
</main>
</body>
</html>
